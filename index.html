<!DOCTYPE html>
<html lang="es">
<head>

  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      background-color: #0d0d0d;
      margin: 0;
      padding: 20px;
    }
    .imvu-wrapper {
      font-family: 'Poppins', sans-serif;
      background-color: #161616;
      color: #ffffff;
      max-width: 750px;
      margin: 20px auto;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      text-align: center;
      padding-bottom: 30px;
    }
    .imvu-banner {
  height: 180px;
  background-color: #252525;
  background-image: url('Banner LoC0o.svg'); /* <-- Añade esto con el nombre exacto de tu imagen */
  background-size: cover;
  background-position: center;
    }

    .imvu-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #161616;
      margin-top: -55px;
      background-color: #333;
      object-fit: cover;
    }
    .imvu-name { margin: 10px 0 5px; font-size: 22px; }
    .imvu-bio { color: #aaa; font-size: 13px; margin-bottom: 20px; }
    .imvu-btn {
      text-decoration: none;
      background: #222;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 12px;
      margin: 0 5px;
      border: 1px solid #333;
      display: inline-block;
    }
    .imvu-btn:hover { background: #fff; color: #000; }

    /* Marco redondeado para el reproductor de YouTube */
.imvu-yt-box {
  width: 100%;
  max-width: 560px; /* Ajusta este ancho si lo quieres más grande (ej. 700px) */
  margin: 20px auto;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #2e2e2e;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
  background: #000;
}

.imvu-yt-box iframe {
  width: 100%;
  height: 315px; /* Ajusta la altura proporcional al ancho (ej. 400px si pones 700px) */
  display: block;
}

    /* Fondo base oscuro */
body {
  background-color: #030305;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Capa fija del SVG animado detrás de todo */
.venom-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  background: radial-gradient(circle at 50% 50%, #12081d 0%, #020203 100%);
  overflow: hidden;
}

.venom-bg svg {
  width: 100%;
  height: 100%;
  filter: contrast(18) blur(6px); /* Efecto líquido viscoso (Gooey effect) */
}

.symbiote-blob {
  fill: #000000;
  stroke: #3b1d5e;
  stroke-width: 4;
  transform-origin: center;
  animation: symbioteMove 12s ease-in-out infinite alternate;
}

.symbiote-blob:nth-child(2) {
  animation-duration: 16s;
  animation-delay: -4s;
  stroke: #1e3a8a;
}

.symbiote-blob:nth-child(3) {
  animation-duration: 20s;
  animation-delay: -8s;
  stroke: #581c87;
}

@keyframes symbioteMove {
  0% { transform: scale(1) rotate(0deg) translate(0, 0); }
  50% { transform: scale(1.25) rotate(12deg) translate(30px, -20px); }
  100% { transform: scale(0.95) rotate(-10deg) translate(-25px, 25px); }
}

  </style>
</head>
<body>
   <div class="venom-bg">
  <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
    <path class="symbiote-blob" d="M150,300 Q250,100 400,250 T650,200 Q700,400 500,450 T150,300 Z" />
    <path class="symbiote-blob" d="M100,150 Q350,50 450,300 T750,350 Q600,550 300,500 T100,150 Z" />
    <path class="symbiote-blob" d="M200,450 Q400,200 600,400 T700,100 Q450,50 250,200 T200,450 Z" />
  </svg>
</div>

  <div>

  <a href="https://www.imvu.com/catalog/web_send_message_widget.php?recipient_id=38638463" target="_blank" class="imvu-btn">Mensaje</a>

<div class="imvu-yt-box">

</body>
</html>
