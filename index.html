<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Perfil IMVU</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      background-color: #0d0d0d;
      margin: 0;
      padding: 20px;
    }
    .imvu-wrapper {
      font-family: 'Poppins', sans-serif;
      background-color: #161616;
      color: #ffffff;
      max-width: 750px;
      margin: 20px auto;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      text-align: center;
      padding-bottom: 30px;
    }
    .imvu-banner {
  height: 180px;
  background-color: #252525;
  background-image: url('Banner LoC0o.svg'); /* <-- Añade esto con el nombre exacto de tu imagen */
  background-size: cover;
  background-position: center;
    }

    .imvu-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #161616;
      margin-top: -55px;
      background-color: #333;
      object-fit: cover;
    }
    .imvu-name { margin: 10px 0 5px; font-size: 22px; }
    .imvu-bio { color: #aaa; font-size: 13px; margin-bottom: 20px; }
    .imvu-btn {
      text-decoration: none;
      background: #222;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 12px;
      margin: 0 5px;
      border: 1px solid #333;
      display: inline-block;
    }
    .imvu-btn:hover { background: #fff; color: #000; }

    /* Contenedor del recuadro de video */
.yt-card {
  position: relative;
  display: block;
  max-width: 460px;
  margin: 20px auto;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #2e2e2e;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}
.yt-card img {
  width: 100%;
  display: block;
  filter: brightness(80%);
  transition: filter 0.2s, transform 0.2s;
}
.yt-card:hover img {
  filter: brightness(100%);
  transform: scale(100%);
}
.yt-play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255, 0, 0, 0.85);
  color: #fff;
  width: 60px;
  height: 40px;
  border-radius: 10px;
  line-height: 40px;
  font-size: 18px;
  text-align: center;
}
  </style>
</head>
<body>

  <div class="imvu-wrapper">
    <div class="imvu-banner"></div>
    <img src="Avatar.gif" class="imvu-avatar" alt="Avatar">
    <h1 class="imvu-name">LoC0o @IMVU</h1>
    <p class="imvu-bio">Bienvenido a mi perfil.</p>
  <div>
  <a href="https://www.imvu.com/catalog/web_add_contact.php?contact=LoC0o" target="_blank" class="imvu-btn">+ Añadir</a>
  <a href="https://www.imvu.com/catalog/web_send_message_widget.php?recipient_id=38638463" target="_blank" class="imvu-btn">Mensaje</a>
  <a href="https://es.imvu.com/catalog/wishlist.php" target="_blank" class="imvu-btn">Wishlist</a>
  </div>

    <a href="https://www.youtube.com/watch?v=tWR-YuUsPGo" target="_blank" class="yt-card">
    <img src="https://www.youtube.com/watch?v=tWR-YuUsPGo" alt="Ver video">
    <div class="yt-play-btn">&#9658;</div>
    </a>


  </div>
  </a>

  </div>

</body>
</html>
