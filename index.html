    /* Tarjeta principal con acabado glass oscuro y borde sutil #240e17 */
    .imvu-wrapper {

      max-width: 750px;
      margin: 55px auto 30px;

      position: relative;
      overflow: visible !important;
      border: 1px solid #381624;

      text-align: center;
      padding-bottom: 28px;
    }

    /* Marco del banner ocupando el 100% de los 750px sin márgenes laterales */
    .imvu-banner-wrap {
      width: 100%;
      height: 250px;
      overflow: hidden;
      border-radius: 17px 17px 0 0;
      background-color: #08040a;
      position: relative;
      z-index: 15;
      border-bottom: 2px solid #4a192e;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
    }

    /* Difuminado inferior sutil para fundir el banner con la tarjeta */
    .imvu-banner-wrap::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 28px;
      background: linear-gradient(to top, rgba(13, 11, 13, 0.95), transparent);
      pointer-events: none;
    }

    .imvu-banner {
      width: 100%;
      height: 100%;
      display: block;
      border: none;

    }

      top: -52px;

      z-index: 25;
      pointer-events: none;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.7));
      animation: flotarBanner 3.2s ease-in-out infinite alternate;

    .pos-izq { left: 28px; animation-delay: 0s; }
    .pos-centro { left: 50%; margin-left: -36px; animation-delay: 0.9s; }
    .pos-der { right: 28px; animation-delay: 1.8s; }

    @keyframes flotarBanner {
      0% { transform: translateY(0px) rotate(-2deg); }

      top: 0;
      left: 0;

      z-index: -1;

      background-image:

        radial-gradient(2px 2px at 120px 180px, rgba(255,255,255,0.85), rgba(0,0,0,0)),

      background-size: 350px 350px, 350px 350px, 350px 350px, 350px 350px, 350px 350px, 350px 350px, 100% 100%;

    .symbiote-web-bg svg { width: 100%; height: 100%; opacity: 0.75; }
    .web-layer-1 { transform-origin: 0% 0%; animation: webSway 10s ease-in-out infinite alternate; }
    .web-layer-2 { transform-origin: 100% 100%; animation: webSwayReverse 14s ease-in-out infinite alternate; }

    .web-strand {
      fill: none;
      stroke: rgba(255, 255, 255, 0.14);
      stroke-width: 1.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.4));

      fill: none;
      stroke: #000000;
      stroke-width: 6;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.5));
      animation: pulseGlow 5s ease-in-out infinite alternate;
    }

    @keyframes webSway { 0% { transform: scale(1) rotate(0deg); } 100% { transform: scale(1.06) rotate(2.5deg); } }
    @keyframes webSwayReverse { 0% { transform: scale(1.04) rotate(0deg); } 100% { transform: scale(0.98) rotate(-3deg); } }
    @keyframes pulseGlow { 0% { filter: drop-shadow(0 0 4px rgba(139, 92, 246, 0.2)); } 100% { filter: drop-shadow(0 0 12px rgba(192, 132, 252, 0.7)); } }

  })();

  // Rastro de telaraña al mover el ratón
  (function() {
    var urlTelarana = 'Telara%C3%B1a%20Cursor.png';
    var ultimoTiempo = 0;

    document.addEventListener('mousemove', function(e) {
      var ahora = Date.now();
      if (ahora - ultimoTiempo < 45) return;
      ultimoTiempo = ahora;

      var web = document.createElement('img');
      web.src = urlTelarana;
      web.className = 'rastro-telarana';
      web.style.left = e.clientX + 'px';
      web.style.top = e.clientY + 'px';

      document.body.appendChild(web);

      setTimeout(function() {
        if (web.parentNode) {
          web.parentNode.removeChild(web);
        }
      }, 800);
    });
  })();

  // Ventana emergente centrada para los botones
  function abrirCentro(url, titulo, ancho, alto) {
    var izquierda = (screen.width / 2) - (ancho / 2);
    var arriba = (screen.height / 2) - (alto / 2);
    window.open(
      url,
      titulo,
      'toolbar=no, location=no, directories=no, status=no, menubar=no, scrollbars=yes, resizable=yes, copyhistory=no, width=' + ancho + ', height=' + alto + ', top=' + arriba + ', left=' + izquierda
    );
  }
</script>

<script>
  // Partículas burdeos/neón interactivas en todo el fondo
  (function() {
    var canvas = document.getElementById('symbioteCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var w, h, particles = [];
    var mouse = { x: -999, y: -999 };
    var colors = ['#8f1d4c', '#b82962', '#ff1e56', '#5e163b', '#e0a3bc'];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    document.addEventListener('mousemove', function(e) {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    for (var i = 0; i < 65; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2.4 + 0.8,
        vy: -(Math.random() * 0.6 + 0.2),
        vx: (Math.random() - 0.5) * 0.3,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: Math.random() * 0.7 + 0.2
      });
    }

    function animate() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        // Reacción suave al pasar el ratón cerca
        var dx = p.x - mouse.x;
        var dy = p.y - mouse.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 110) {
          p.x += (dx / dist) * 1.2;
          p.y += (dy / dist) * 1.2;
        }

        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }
    animate();
  })();
</script>

      document.getElementById('visitCounter').innerText = '👁️ En línea';
    });
</script>
