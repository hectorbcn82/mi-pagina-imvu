.imvu-yt-box {

/* Fondo base oscuro */
body {
  background-color: #030305;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Capa fija de telarañas de simbionte detrás de todo */
.symbiote-web-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  background: radial-gradient(circle at 50% 40%, #160924 0%, #030305 85%);
  overflow: hidden;
}

.symbiote-web-bg svg {
  width: 100%;
  height: 100%;
  opacity: 0.75;
}

/* Animación de respiración y balanceo de la telaraña */
.web-layer-1 {
  transform-origin: 0% 0%;
  animation: webSway 10s ease-in-out infinite alternate;
}

.web-layer-2 {
  transform-origin: 100% 100%;
  animation: webSwayReverse 14s ease-in-out infinite alternate;
}

/* Hilos principales de simbionte */
.web-strand {
  fill: none;
  stroke: rgba(255, 255, 255, 0.14);
  stroke-width: 1.5;
  stroke-linecap: round;
  filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.4));
}

/* Hilos gruesos orgánicos (estilo Venom) */
.venom-tendril {
  fill: none;
  stroke: #000000;
  stroke-width: 6;
  stroke-linecap: round;
  filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.5));
  animation: pulseGlow 5s ease-in-out infinite alternate;
}

@keyframes webSway {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.06) rotate(2.5deg); }
}

@keyframes webSwayReverse {
  0% { transform: scale(1.04) rotate(0deg); }
  100% { transform: scale(0.98) rotate(-3deg); }
}

@keyframes pulseGlow {
  0% { filter: drop-shadow(0 0 4px rgba(139, 92, 246, 0.2)); }
  100% { filter: drop-shadow(0 0 12px rgba(192, 132, 252, 0.7)); }
}

  /* Cursor principal (Cara de Venom) */
  body, html {
    cursor: url('https://raw.githubusercontent.com/hectorbcn82/mi-pagina-imvu/refs/heads/main/Cursor%20Cara%20Venom.png'), auto !important;
  }

  /* Cursor sobre enlaces y botones (Logo de Venom) */
  a, a:hover, button, .imvu-btn {
    cursor: url('https://raw.githubusercontent.com/hectorbcn82/mi-pagina-imvu/refs/heads/main/Cursor%20Logo%20Venom.png'), pointer !important;
  }

  /* Estilo de las telarañas del rastro */
  .rastro-telarana {
    position: fixed;
    pointer-events: none;
    width: 28px;
    height: 28px;
    z-index: 999999;
    transform: translate(-50%, -50%);
    animation: desvanecerWeb 0.8s linear forwards;
  }

  @keyframes desvanecerWeb {
    0% {
      opacity: 0.9;
      transform: translate(-50%, -50%) scale(0.8);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.3);
    }
  }

</style>
