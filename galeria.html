<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    padding: 6px;
    overflow-x: hidden;
    color: #e0a3bc;
  }

  /* Scrollbar estilo Symbionte */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #050204; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #5c1634, #8f1d4c);
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #8f1d4c, #ff1e56);
  }

  .grid-fotos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }

  .foto-item {
    display: block;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #4a192e;
    background: #090507;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .foto-item:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: #ff1e56;
    box-shadow: 0 6px 18px rgba(255, 30, 86, 0.45);
  }

  .foto-item img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
  }

  .estado-mensaje {
    text-align: center;
    padding: 40px 15px;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #b84473;
  }
</style>
</head>
<body>

  <div id="galeriaContenedor" class="grid-fotos">
    <div class="estado-mensaje">Cargando galería Symbionte...</div>
  </div>

  <script>
    (function() {
      const usuario = 'hectorbcn82';
      const repo = 'mi-pagina-imvu';
      const carpeta = 'Fotos';
      const apiUrl = `https://github.com{usuario}/${repo}/contents/${carpeta}`;
      const contenedor = document.getElementById('galeriaContenedor');

      fetch(apiUrl)
        .then(res => {
          if (!res.ok) throw new Error('No se pudo leer la carpeta');
          return res.json();
        })
        .then(archivos => {
          // Filtra solo archivos de imagen válidos
          const imagenes = archivos.filter(item =>
            item.type === 'file' && /\.(jpe?g|png|gif|webp)$/i.test(item.name)
          );

          if (imagenes.length === 0) {
            contenedor.innerHTML = '<div class="estado-mensaje">No hay fotos en la carpeta todavía.</div>';
            return;
          }

          contenedor.innerHTML = '';

          imagenes.forEach(img => {
            const enlace = document.createElement('a');
            enlace.href = img.download_url;
            enlace.target = '_blank';
            enlace.rel = 'noopener noreferrer';
            enlace.className = 'foto-item';
            enlace.title = img.name.replace(/\.[^/.]+$/, ""); // Nombre sin extensión

            const foto = document.createElement('img');
            foto.src = img.download_url;
            foto.alt = img.name;
            foto.loading = 'lazy';

            enlace.appendChild(foto);
            contenedor.appendChild(enlace);
          });
        })
        .catch(() => {
          contenedor.innerHTML = '<div class="estado-mensaje">Error al conectar con GitHub. Inténtalo más tarde.</div>';
        });
    })();
  </script>

</body>
</html>
